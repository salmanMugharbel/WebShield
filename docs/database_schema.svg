<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 454" style="background:#0a1020" font-family="Segoe UI, sans-serif">
  <title>WebShield database schema</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" fill="#f1f5fb" font-size="18" font-weight="700">WebShield · SQLite schema (database/schema.sql)</text>

  <!-- users -->
  <rect x="30" y="60" width="240" height="150" rx="10" fill="#111b30" stroke="#3b82f6" stroke-width="2"/>
  <rect x="30" y="60" width="240" height="32" rx="10" fill="#1e3a8a"/>
  <text x="150" y="82" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">users</text>
  <g font-size="13" fill="#dbe4f3" font-family="Consolas, monospace">
    <text x="45" y="115">🔑 id INTEGER PK</text>
    <text x="45" y="138">username TEXT UNIQUE NOT NULL</text>
    <text x="45" y="161">password_hash TEXT NOT NULL</text>
    <text x="45" y="184">created_at TEXT</text>
  </g>

  <!-- posts -->
  <rect x="330" y="60" width="240" height="170" rx="10" fill="#111b30" stroke="#22d3ee" stroke-width="2"/>
  <rect x="330" y="60" width="240" height="32" rx="10" fill="#155e75"/>
  <text x="450" y="82" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">posts</text>
  <g font-size="13" fill="#dbe4f3" font-family="Consolas, monospace">
    <text x="345" y="115">🔑 id INTEGER PK</text>
    <text x="345" y="138">🔗 user_id → users.id</text>
    <text x="345" y="161">title TEXT (1–120)</text>
    <text x="345" y="184">content TEXT (≤5000)</text>
    <text x="345" y="207">created_at TEXT</text>
  </g>

  <!-- comments -->
  <rect x="630" y="60" width="240" height="170" rx="10" fill="#111b30" stroke="#10b981" stroke-width="2"/>
  <rect x="630" y="60" width="240" height="32" rx="10" fill="#065f46"/>
  <text x="750" y="82" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">comments</text>
  <g font-size="13" fill="#dbe4f3" font-family="Consolas, monospace">
    <text x="645" y="115">🔑 id INTEGER PK</text>
    <text x="645" y="138">🔗 post_id → posts.id</text>
    <text x="645" y="161">🔗 user_id → users.id</text>
    <text x="645" y="184">comment_content (1–500)</text>
    <text x="645" y="207">created_at TEXT</text>
  </g>

  <!-- activity_logs -->
  <rect x="180" y="270" width="540" height="164" rx="10" fill="#111b30" stroke="#f59e0b" stroke-width="2"/>
  <rect x="180" y="270" width="540" height="32" rx="10" fill="#78350f"/>
  <text x="450" y="292" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">activity_logs (independent – no personal data)</text>
  <g font-size="13" fill="#dbe4f3" font-family="Consolas, monospace">
    <text x="195" y="325">🔑 id INTEGER PK</text>
    <text x="195" y="348">event_type TEXT NOT NULL</text>
    <text x="195" y="371">implementation CHECK IN (vulnerable, secure, application)</text>
    <text x="195" y="394">security_status CHECK IN (EXPLOITED, BLOCKED,</text>
    <text x="195" y="417">  DETECTED, NORMAL, INFO) · description (≤500) · created_at</text>
  </g>

  <!-- relations -->
  <line x1="270" y1="112" x2="328" y2="134" stroke="#22d3ee" stroke-width="2" marker-end="url(#a)"/>
  <text x="298" y="110" text-anchor="middle" fill="#94a3b8" font-size="11">1 : N</text>
  <line x1="570" y1="112" x2="628" y2="134" stroke="#22d3ee" stroke-width="2" marker-end="url(#a)"/>
  <text x="598" y="110" text-anchor="middle" fill="#94a3b8" font-size="11">1 : N</text>
  <path d="M150 210 C150 250, 600 250, 700 232" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="300" y="252" fill="#94a3b8" font-size="11">users 1 : N comments (ON DELETE CASCADE)</text>
</svg>
